name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests + coverage
        run: pytest -q -m "not integration" --cov --cov-report=term --cov-report=xml

      - name: Integration tests (Bronze -> Silver -> Gold on local Delta, failure scenarios)
        run: pytest -q -m integration

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Custom Viz specs compile (Vega-Lite)
        run: |
          npm install --no-save --silent vega-lite@5.21.0 vega@5.30.0
          node tools/compile_vega_specs.js dashboards/custom_viz

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Chỉ chạy khi repo variable CD_ENABLED = 'true' (Settings -> Variables). Khi đã bật mà
  # thiếu secret -> FAIL (không còn "xanh mà thật ra bị bỏ qua").
  # Chưa bật -> job hiện "skipped" trên PR, đúng với thực tế là bundle CHƯA được validate.
  bundle-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: vars.CD_ENABLED == 'true'
    # environment riêng -> OIDC subject = repo:<owner>/<repo>:environment:ci
    # (tạo federation policy riêng cho CI, quyền chỉ đủ để validate)
    environment: ci
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    permissions:
      contents: read
      id-token: write   # OIDC, chỉ job này
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.28.0
      - name: Require OIDC config
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_CLIENT_ID" ]; then
            echo "::error::CD_ENABLED=true nhưng environment 'ci' thiếu DATABRICKS_HOST / DATABRICKS_CLIENT_ID"
            exit 1
          fi
          echo "DATABRICKS_AUTH_TYPE=github-oidc" >> "$GITHUB_ENV"
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev
