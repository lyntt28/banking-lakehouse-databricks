name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

  bundle-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    permissions:
      contents: read
      id-token: write   # OIDC (giống CD)
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1.28.0

      - name: Auth mode
        if: env.DATABRICKS_HOST != ''
        run: |
          if [ -n "$DATABRICKS_CLIENT_ID" ]; then
            echo "DATABRICKS_AUTH_TYPE=github-oidc" >> "$GITHUB_ENV"
          fi

      - name: Validate bundle (dev)
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev

      # Chưa có secret -> KHÔNG kiểm tra bundle. Ghi warning để hiện rõ trên PR
      # (tránh hiểu nhầm dấu ✓ là bundle đã được validate).
      - name: Bundle NOT validated (secrets missing)
        if: env.DATABRICKS_HOST == ''
        run: |
          echo "::warning title=Bundle not validated::Add DATABRICKS_HOST and DATABRICKS_CLIENT_ID (OIDC) or DATABRICKS_TOKEN repo secrets to validate the bundle."
          echo "## ⚠️ Bundle validation skipped: Databricks secrets not configured" >> "$GITHUB_STEP_SUMMARY"
