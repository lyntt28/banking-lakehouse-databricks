[project]
name = "banking-lakehouse"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

# `pip install -e .` -> import common / pipelines / data_generator không cần sys.path.
# Notebook trên Databricks vẫn tự thêm src/ vào sys.path (bundle đồng bộ source, không build wheel).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["common*", "pipelines*", "data_generator*"]

[tool.coverage.run]
source = ["src/common", "src/pipelines"]
omit = ["src/common/lakeview/*"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: Bronze -> Silver -> Gold end-to-end trên Spark + Delta local (chậm)",
]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B"]

# Notebook Databricks: spark/dbutils/display có sẵn (F821), import sau cell sys.path (E402),
# dòng "# MAGIC" markdown dài (E501)
[tool.ruff.lint.per-file-ignores]
"src/0*/*.py" = ["F821", "E402", "E501"]
