# Databricks Asset Bundle (DAB) - mô tả toàn bộ project dưới dạng code.
# Mỗi target = 1 môi trường. Code giống nhau, chỉ khác catalog.
bundle:
  name: banking-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment
    default: bank_dev
  notification_email:
    description: >
      Email nhận cảnh báo khi Job lỗi (chỉ dùng ở test/prod).
      Truyền khi deploy: databricks bundle deploy -t prod --var notification_email=you@example.com
    default: alerts@example.com

  warehouse_id:
    description: SQL warehouse chạy 3 dashboard AI/BI (Free Edition có sẵn "Serverless Starter Warehouse")
    lookup:
      warehouse: Serverless Starter Warehouse
  governance_dry_run:
    description: >
      true = chỉ in SQL governance (Free Edition không có account groups);
      false = áp dụng GRANT / column mask / row filter. Prod luôn false (xem target prod).
    default: "true"
  expected_lag_days:
    description: >
      Ngày dữ liệu phải có = hôm nay - N (1 = file hôm qua). "" = tắt kiểm tra ngày dự kiến / SLA
      (dev, test chạy theo file có sẵn). Prod = 1.
    default: ""
  run_as_sp:
    description: >
      Application ID của service principal CHẠY job (runtime identity) ở test/prod.
      Khác với identity deploy (CI/CD). Truyền khi deploy: --var run_as_sp=<application-id>
    default: ""

targets:
  dev:
    mode: development       # tên Job có tiền tố [dev <user>], Job bị pause sẵn
    default: true
    variables:
      catalog: bank_dev

  test:
    mode: production
    variables:
      catalog: bank_test
    run_as:
      service_principal_name: ${var.run_as_sp}
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        banking_lakehouse_daily:
          email_notifications:
            on_failure:
              - ${var.notification_email}
        banking_maintenance_weekly:
          email_notifications:
            on_failure:
              - ${var.notification_email}
        banking_ml_cross_sell_weekly:
          email_notifications:
            on_failure:
              - ${var.notification_email}

  prod:
    mode: production
    variables:
      catalog: bank_prod
      # Prod enforce governance thật; Free Edition (không có account group) chỉ chạy dev/test.
      governance_dry_run: "false"
      expected_lag_days: "1"
    run_as:
      service_principal_name: ${var.run_as_sp}
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        banking_lakehouse_daily:
          # Chỉ prod chạy theo lịch: mỗi giờ 06:30 -> 10:30 giờ Việt Nam. File chưa về trước
          # SLA (09:00) -> WAITING, lần sau chạy tiếp; 09:30 vẫn thiếu -> FAILED + email.
          # Đã xử lý xong thì các lần sau không có ngày chờ (idempotent).
          schedule:
            quartz_cron_expression: "0 30 6-10 * * ?"
            timezone_id: Asia/Ho_Chi_Minh
            pause_status: UNPAUSED
          email_notifications:
            on_failure:
              - ${var.notification_email}
        banking_maintenance_weekly:
          schedule:
            quartz_cron_expression: "0 0 3 ? * SUN"   # 03:00 Chủ nhật
            timezone_id: Asia/Ho_Chi_Minh
            pause_status: UNPAUSED
          email_notifications:
            on_failure:
              - ${var.notification_email}
        banking_ml_cross_sell_weekly:
          # Notebook ML tự kiểm tra Gold đã publish trong 2 ngày gần nhất, không thì dừng.
          schedule:
            quartz_cron_expression: "0 30 8 ? * MON"   # 08:30 thứ Hai, sau job daily
            timezone_id: Asia/Ho_Chi_Minh
            pause_status: UNPAUSED
          email_notifications:
            on_failure:
              - ${var.notification_email}

  # Đợt 2: thêm target azure (host = workspace Azure Databricks, cluster riêng)
