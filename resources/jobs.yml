# Định nghĩa Job. Free Edition chỉ có serverless nên không khai báo cluster.
resources:
  jobs:
    banking_lakehouse_daily:
      name: banking_lakehouse_daily
      max_concurrent_runs: 1
      # Email cảnh báo khi lỗi: chỉ khai báo ở target test/prod (databricks.yml),
      # vì email rỗng ở dev làm bundle deploy báo lỗi.

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: as_of_date        # trống = mọi ngày chưa xử lý sau watermark (ops.pipeline_runs)
          default: ""
        # Ngày dự kiến + SLA: "" = tắt (dev/test chạy theo file có sẵn). Prod = 1: mỗi lần chạy
        # phải có file của hôm qua; thiếu trước sla_hour -> WAITING, quá giờ -> FAILED + email
        - name: expected_lag_days
          default: ${var.expected_lag_days}
        - name: sla_hour
          default: "9"
        # Ngày bắt đầu lịch hằng ngày; trước đó chỉ đòi snapshot cuối tháng. "" = tự suy ra
        - name: daily_from
          default: ""

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup/01_create_catalog_schema.py
          max_retries: 1
          min_retry_interval_millis: 60000

        # Bronze: Auto Loader nạp file mới từ Volume landing (chạy lại không nhân đôi)
        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../src/01_bronze/01_bronze_ingest.py
          max_retries: 1
          min_retry_interval_millis: 60000

        # Silver -> Gold xen kẽ từng ngày chờ xử lý: DQ gate, MERGE / SCD2, rồi Gold
        # staging -> gate đối soát -> publish. Không retry tự động: lỗi DQ / thiếu file /
        # đối soát không tự hết; chạy lại job sau khi xử lý (idempotent).
        - task_key: silver_gold
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_silver/00_daily_silver_gold.py
          max_retries: 0

        # View cho dashboard (1 view / visual)
        - task_key: dashboard_views
          depends_on:
            - task_key: silver_gold
          notebook_task:
            notebook_path: ../src/03_gold/02_dashboard_views.py
          max_retries: 1
          min_retry_interval_millis: 60000

        # Governance: GRANT + che cột PII + lọc dòng theo chi nhánh. Chạy SAU gold vì
        # gold ghi đè một số bảng; câu lệnh idempotent.
        - task_key: governance
          depends_on:
            - task_key: dashboard_views
          notebook_task:
            notebook_path: ../src/00_setup/03_governance.py
            base_parameters:
              dry_run: ${var.governance_dry_run}
          max_retries: 0

    # Bảo trì Delta hằng tuần: liquid clustering + OPTIMIZE + VACUUM (giữ 7 ngày)
    banking_maintenance_weekly:
      name: banking_maintenance_weekly
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: maintain
          notebook_task:
            notebook_path: ../src/00_setup/04_maintenance.py
            base_parameters:
              mode: maintain

    # ML bán chéo bảo hiểm: feature table + train + MLflow (UC registry) + chấm điểm
    banking_ml_cross_sell_weekly:
      name: banking_ml_cross_sell_weekly
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: label_mode
          default: holder
        - name: max_gold_age_days   # Gold publish gần nhất cũ hơn -> dừng, không train dữ liệu cũ
          default: "2"
      tasks:
        - task_key: train_and_score
          notebook_task:
            notebook_path: ../src/04_ml/01_insurance_cross_sell.py
          # thư viện cài bằng %pip ở đầu notebook (serverless notebook task)
