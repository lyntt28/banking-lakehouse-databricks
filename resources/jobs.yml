# Định nghĩa Job. Free Edition chỉ có serverless nên không khai báo cluster.
# Các task bronze/silver/gold sẽ được thêm khi có code (ngày 1-2).
resources:
  jobs:
    banking_lakehouse_daily:
      name: banking_lakehouse_daily
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.notification_email}

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/00_setup/01_create_catalog_schema.py
          max_retries: 1
          min_retry_interval_millis: 60000

        # - task_key: bronze
        #   depends_on: [{task_key: setup}]
        #   notebook_task:
        #     notebook_path: ../src/01_bronze/...
